<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TechNova</title>
    <link rel ="stylesheet" href="assets/css/dang-nhap.css">
</head>
<body>

    <main class="auth-container"><a class="auth-back" href="index.html">← Về TechNova</a>
        <div id="message-box" class="message-box" role="status" aria-live="polite"></div>

        <p class="auth-demo-note">Tài khoản thực hành trên trình duyệt. Không dùng mật khẩu thật.</p><form id="login-form">
            <h2>Chào mừng trở lại!</h2>
            <p class="subtitle">Đăng nhập bằng tài khoản demo đã đăng ký</p>
            
            <div class="input-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="Nhập email của bạn" required>
            </div>

            <div class="input-group">
                <label for="login-password">Mật khẩu</label>
                <input type="password" id="login-password" placeholder="Nhập mật khẩu" required>
            </div>

            <!-- TODO HS: Chỉ thêm ghi nhớ/quên mật khẩu khi đã xử lý được các luồng đó. -->

            <button type="submit" class="btn-submit">Đăng Nhập</button>

            <p class="switch-text">
                Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a>
            </p>
        </form>
    </main>
<script src="assets/js/dang-nhap.js"></script>
</body>
</html>
